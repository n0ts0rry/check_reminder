name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --onefile --noconsole --name CheckInstrumentReminder reminder.py
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\CheckInstrumentReminder.exe, config.json, install_task.bat, uninstall_task.bat package\
      - uses: actions/upload-artifact@v4
        with:
          name: CheckInstrumentReminder
          path: package/
